<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Contador</title></head>
<body>
  <h1>Contador</h1>
  <p id="valor">0</p>
  <button onclick="incrementar()">+1</button>
  <button onclick="decrementar()">-1</button>
</body>
</html>

<script>
let valor = 0;
function incrementar(){ valor++; document.getElementById('valor').innerText = valor; }
function decrementar(){ valor--; document.getElementById('valor').innerText = valor; }
</script>
